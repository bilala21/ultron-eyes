[project]
name = "ultron-eyes"
version = "0.1.0"
description = "Local, private AI search for home security camera events: object detection, license plate reading, and plain-English search."
readme = "README.md"
license = "MIT"
authors = [{ name = "bilala21" }]
requires-python = ">=3.12"
dependencies = [
    "fast-alpr>=0.4.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "onnxruntime>=1.32.0",
    "open-image-models>=0.6.0",
    "opencv-python-headless>=5.0.0.93",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.optional-dependencies]
gemini = ["google-genai>=3.3.0"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
ultron-eyes = "ultron_eyes.cli:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
